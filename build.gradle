// Top-level build file
plugins {
    id 'com.android.application' version '8.3.0' apply true
}

// ❌ 删除这一整段！
// android {
//     compileSdk 34
//     // ...
// }

    defaultConfig {
        applicationId "com.example.qqmusicadblock"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 避免 lint 中断构建
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // 不再需要任何 Xposed 远程依赖！
}
